grafana:
  enabled: true
  adminPassword: "${grafana_password}"
  persistence:
    enabled: true
    size: 10Gi
  ingress:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "50GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  config:
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: '${alert_email}'
    route:
      receiver: 'default'
    receivers:
      - name: 'default'
        email_configs:
          - to: '${alert_email}'
            send_resolved: true
